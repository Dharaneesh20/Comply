services:
  postgres:
    image: postgres:16-alpine
    container_name: align-postgres
    restart: always
    environment:
      POSTGRES_DB: align_db
      POSTGRES_USER: align_user
      POSTGRES_PASSWORD: align_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U align_user -d align_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
