spring:
  application:
    name: align-compliance-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/align_db?directConnection=true&serverSelectionTimeoutMS=2000&appName=mongosh+2.7.0

jwt:
  secret: ${JWT_SECRET:align_compliance_platform_jwt_secret_key_production_grade_super_secure_32bytes_minimum_length!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

server:
  port: ${PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.align.compliance: DEBUG
    org.springframework.data.mongodb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
